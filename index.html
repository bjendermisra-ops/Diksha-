.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(7,8,10,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(197,160,89,.4);padding:8px 8px calc(8px + env(safe-area-inset-bottom));color:#f3e3b6}

.dock .main{color:#1a1205;background:linear-gradient(90deg,#b88e3e,#e2c383);border-radius:14px;font-weight:700}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:28px 28px 0 0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s}.sheet h3{font-size:24px;margin-bottom:4px}
.x{position:absolute;right:16px;top:14px;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.vm{align-items:center;padding:16px}.vm .box{position:relative;width:100%;max-width:640px}.vm iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}.vm .x{top:-56px;right:0}

.toast.show{transform:translate(-50%,0)}.toast .ic{color:var(--gold2)}

.hidden{display:none!important}

const t=(k,...a)=>{const v=D[L][k];return typeof v==='function'?v(...a):v};
const hasDev=s=>/[\u0900-\u097F]/.test(s||'');
const nm=()=>L==='en'?(nameEn||(hasDev(name)?'':name)):name;
const salW=()=>L==='en'?(G==='m'?'Prabhuji':G==='f'?'Mataji':''):(G==='m'?'प्रभुजी':G==='f'?'माताजी':'जी');
function dear(){const n=nm();return L==='hi'?`प्रिय ${n||'दीक्षार्थी भक्त'} ${salW()},`:'Dear '+((n+' '+salW()).trim()||'Devotee')+','}
function introName(){const n=nm();return L==='hi'?((n?n+' ':'')+(G?salW():'')).trim():((n?n+' ':'')+salW()).trim()}

function toast(m){const e=$('toast');$('toast-t').textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2800)}
function go(id){$(id).scrollIntoView({behavior:'smooth'})}
function closeAll(){$('cal-ov').classList.remove('show');$('vid-ov').classList.remove('show');$('yt').src=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
function applyLang(){
  document.documentElement.lang=L;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=t(e.dataset.h));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  document.querySelectorAll('[data-a]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.a)));
  document.querySelectorAll('.lg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===L)));
  $('who').textContent=dear();const iN=$('iname');if(iN)iN.textContent=introName();
  applyG('');tick(true);dayMode();helpUI();
}
function setLang(l){L=l;explicit=true;store.set('diksha_lang',l);applyLang()}

/* Intro */
function openIntro(){
  if(opened||!$('intro'))return;opened=true;const i=$('intro');i.classList.add('lit');store.set('diksha_intro','1');
  setTimeout(()=>i.classList.add('go'),950);setTimeout(()=>document.body.classList.add('play'),1150);setTimeout(()=>i.remove(),2400);
}
/* Countdown */
let lastS='';
function tick(f){
  const now=Date.now(),diff=START-now,p=n=>String(n).padStart(2,'0');
  if(diff<=0){$('cd').classList.add('hidden');$('live').classList.remove('hidden');const on=now<END;$('cd-h').textContent=t(on?'liveH':'doneH');$('live').textContent=t(on?'liveT':'doneT');return}
  $('cd').classList.remove('hidden');$('live').classList.add('hidden');$('cd-h').textContent=t('cdH');
  $('d').textContent=p(Math.floor(diff/864e5));$('h').textContent=p(Math.floor(diff%864e5/36e5));$('m').textContent=p(Math.floor(diff%36e5/6e4));
  const s=p(Math.floor(diff%6e4/1e3));if(s!==lastS&&!f){const e=$('s');e.classList.remove('tk');void e.offsetWidth;e.classList.add('tk')}lastS=s;$('s').textContent=s;
}
/* Event-day mode */
function dayMode(){
  const n=Date.now(),on=q.get('today')==='1'||(n>START-12*36e5&&n<END);$('today').classList.toggle('hidden',!on);
  const li=document.querySelectorAll('.tl li');li.forEach(e=>{e.classList.remove('now');const o=e.querySelector('.nt');if(o)o.remove()});
  if(!on)return;const m=(n-START)/6e4,idx=m<0?[0]:m<150?[1,2]:[3];
  idx.forEach(i=>{li[i].classList.add('now');const s=document.createElement('em');s.className='tag nt';s.textContent=t(m<0?'next':'nowT');li[i].querySelector('b').appendChild(s)});
}
function helpUI(){
  const c=HELP.call,w=HELP.wa;$('hl').classList.toggle('hidden',!(c||w));
  [['hcall',c,'tel:+'],['tcall',c,'tel:+']].forEach(([id,v,p])=>{$(id).classList.toggle('hidden',!v);if(v)$(id).href=p+v});
  $('hwa').classList.toggle('hidden',!w);if(w)$('hwa').href='https://wa.me/'+w;
}
/* Gender + checklist */
function applyG(v){
  v=String(v||'').toLowerCase().trim();
  G=/^(f|mataji|mahila|माता|महिला)/.test(v)?'f':/^(m|p|prabhu|प्रभु|पुरुष)/.test(v)?'m':G;
  document.body.classList.toggle('f',G==='f');
  ITEMS=['c1','c2','c3','c4','c5'].map(k=>t(k));if(G!=='f')ITEMS.push(t('c6'));
  render();
}
function render(){
  $('list').innerHTML=ITEMS.map((x,i)=>`<button class="chk ${done.includes(i)?'on':''}" role="checkbox" aria-checked="${done.includes(i)}" onclick="toggle(${i})"><i><svg class="ic"><use href="#check"/></svg></i><span>${x}</span></button>`).join('');
  $('stat').textContent=t('stat',done.length,ITEMS.length);$('bar').style.width=done.length/ITEMS.length*100+'%';
  $('ready-t').textContent=ready?t('readyDone'):t('ready');$('ready').classList.toggle('green',ready);$('ready').classList.toggle('gold',!ready);
}
function toggle(i){done=done.includes(i)?done.filter(x=>x!==i):[...done,i];ready=false;save();render()}
function save(){store.set(LS,JSON.stringify({done,ready}));if(db&&token)db.collection('participants').doc(token).update({checklist:done,checklistTotal:ITEMS.length,ready:ready,lastSeen:firebase.firestore.FieldValue.serverTimestamp(),lastEvent:'checklist'}).catch(()=>{})}
function petals(){
  const C=['#f4b6cb','#e88fb0','#f6d98b','#fff1c9'];
  for(let i=0;i<30;i++){const e=document.createElement('i');e.className='pt';e.style.cssText=`left:${Math.random()*100}%;background:${C[i%4]};animation-duration:${2.6+Math.random()*2.4}s;animation-delay:${Math.random()*.9}s;transform:scale(${.7+Math.random()*.8})`;document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}
}
$('ready').onclick=()=>{
  if(done.length<ITEMS.length){const b=$('ready');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast(t('left',ITEMS.length-done.length));return}
  ready=true;save();render();petals();toast(t('rdy',nm()?nm()+' '+salW():salW()));
  if(db&&token)db.collection('participants').doc(token).update({ready:true,readyAt:firebase.firestore.FieldValue.serverTimestamp(),lastSeen:firebase.firestore.FieldValue.serverTimestamp(),lastEvent:'ready','clicks.ready':firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
};

/* Share + tracking */
function link(){const b=document.baseURI,en=L==='en';return token?(CLEAN?b+'i/'+token+(en?'?l=en':''):b+'?t='+token+(en?'&l=en':'')):b+(en?'?l=en':'')}

function refer(e){e.preventDefault();const n=$('rn').value.trim(),p=$('rp').value.trim();if(!n)return;wa(p,t('rfM',n,link()));if(db)db.collection('referrals').add({from:token||null,name:n,at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});$('rn').value='';$('rp').value='';track('referral');toast(t('refToast'))}
function openVid(id){$('yt').src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';$('vid-ov').classList.add('show')}
function sendMsg(){
  const x=$('mt').value.trim();if(!x)return toast(t('mEmpty'));if(!db)return toast(t('mWait'));
  db.collection('messages').add({pid:token||null,name:name||'',phone:phone,text:x.slice(0,400),status:'new',at:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{$('mt').value='';toast(t('mOk'));track('msg')}).catch(()=>toast(t('mFail')));
}
function sparks(){const h=document.querySelector('.sp');for(let i=0;i<14;i++){const s=document.createElement('i'),z=2+Math.random()*4;s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*12}s`;h.appendChild(s)}}

    token=(i>-1&&parts[i+1]||q.get('t')||q.get('token')||q.get('id')||'').trim();
    if(window.firebase){
      firebase.initializeApp({apiKey:"AIzaSyASMDZyfcAjg5Nb1GAwQqkufvAdqZfy2us",authDomain:"diksha-invitation.firebaseapp.com",projectId:"diksha-invitation",storageBucket:"diksha-invitation.firebasestorage.app",messagingSenderId:"720673907233",appId:"1:720673907233:web:6a3e5a0fd49012e1177960"});
